services:
  ingestion_app:
    image: mage:finance
    working_dir: /app

    volumes:
      - .:/app

    command: ["fastapi", "run", "app/main.py","--host", "0.0.0.0","--port", "8055"]
    env_file:
      - .env
    ports:
      - "8055:8055"
    networks:
      - mage
  
networks:
  mage:  # Use the same network name
    external: true
